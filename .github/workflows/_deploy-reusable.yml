name: Reusable Deploy

on:
  workflow_call:
    inputs:
      app_name: { required: true, type: string }
      app_path: { required: true, type: string }
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_KEY: { required: true }
      SSH_PORT: { required: false }
      REGISTRY_HOST: { required: true }
      REGISTRY_NAMESPACE: { required: true }
      REGISTRY_USERNAME: { required: true }
      REGISTRY_PASSWORD: { required: true }

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.app_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 ACR
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. 统一构建并推送镜像
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.app_path }}/Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_NAMESPACE }}/${{ inputs.app_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          outputs: type=image,oci-mediatypes=false

      # 3. 远程拉取并重启
      - name: Deploy on Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS="-o StrictHostKeyChecking=no -o HostKeyAlgorithms=+ssh-rsa,ecdsa-sha2-nistp256 -o PubkeyAcceptedKeyTypes=+ssh-rsa,ecdsa-sha2-nistp256"
          ssh-keyscan -t rsa,ecdsa -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT $SSH_OPTS $SSH_USER@$SSH_HOST << EOF
            set -euo pipefail
            APP="${{ inputs.app_name }}"
            TAG="${{ github.sha }}"
            
            # 登录 ACR
            echo "$REGISTRY_PASSWORD" | docker login $REGISTRY_HOST -u "$REGISTRY_USERNAME" --password-stdin
            
            # 记录 TAG
            cd /opt/apps
            touch .env.tags
            grep -v "^\${APP^^}_TAG=" .env.tags > .env.tags.tmp || true
            echo "\${APP^^}_TAG=\$TAG" >> .env.tags.tmp
            mv .env.tags.tmp .env.tags
            
            # 拉取并重启
            docker compose --env-file .env.tags pull "\$APP"
            docker compose --env-file .env.tags up -d --no-deps "\$APP"
            docker image prune -f
          EOF
