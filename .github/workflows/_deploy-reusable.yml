          #   set -e
          #   APP=${{inputs.app_name}}
          #   cd /tmp/$APP
          #   docker load < image.tar.gz
          #   docker stop $APP || true
          #   docker rm $APP || true
          #   docker run -d --name $APP \
          #     --restart unless-stopped \
          #     -p $(cat /root/apps/$APP/port):$(cat /root/apps/$APP/container_port) \
          #     --env-file /root/apps/$APP/.env \
          #     $APP:${{github.sha}}
