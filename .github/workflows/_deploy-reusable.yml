name: Reusable Deployment Workflow

on:
  workflow_call:
    inputs:
      app_name:
        description: 'The name of the application to deploy'
        required: true
        type: string
      app_path:
        description: 'The path to the application directory'
        required: true
        type: string
    secrets:
      SSH_HOST:
        description: 'SSH Host'
        required: true
      SSH_USER:
        description: 'SSH User'
        required: true
      SSH_KEY:
        description: 'SSH Private Key'
        required: true
      SSH_PORT:
        description: 'SSH Port'
        required: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t ${{ inputs.app_name }}:${{ github.sha }} \
          -f ${{ inputs.app_path }}/Dockerfile .

      - name: Save image to tar
        run: |
          docker save ${{ inputs.app_name }}:${{ github.sha }} | gzip > image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          key: ${{secrets.SSH_KEY}}
          port: ${{secrets.SSH_PORT}}
          source: "image.tar.gz"
          target: "/tmp/${{inputs.app_name}}"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          key: ${{secrets.SSH_KEY}}
          port: ${{secrets.SSH_PORT}}
          scripts:
            cd /root/apps
            echo "$APP_TAG=${{github.sha}}" >> .env.tags
            docker compose --env-file .env.tags up -d $APP
