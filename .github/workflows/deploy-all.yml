name: Deploy All Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # 自动扫描 apps 目录下的所有文件夹
          APPS=$(ls apps | jq -R -s -c 'split("\n")[:-1]')
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "Detected apps: $APPS"

  deploy:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      app_name: ${{ matrix.app }}
      app_path: apps/${{ matrix.app }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
