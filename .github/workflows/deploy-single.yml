name: Deploy Single App

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: '选择要部署的 App'
        required: true
        type: choice
        options:
          - web
          - api
          - admin

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        app: ${{fromJson(format('["{0}"]', inputs.app))}}
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      app_name: ${{matrix.app}}
      app_path: apps/${{matrix.app}}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
