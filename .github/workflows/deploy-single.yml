name: Deploy Single App

on:
  workflow_dispatch:
    inputs:
      app:
        description: '选择要部署的 App'
        required: true
        type: choice
        options:
          - web
          - api
          # 有新增 app 记得在这里加一行

permissions:
  contents: read

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(format('["{0}"]', inputs.app)) }}
    uses: ./.github/workflows/_deploy-reusable.yml
    with:
      app_name: ${{ matrix.app }}
      app_path: apps/${{ matrix.app }}
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
